name: React Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend-react/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend-react/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Lint
        working-directory: frontend-react
        run: npm run lint

      - name: Test
        working-directory: frontend-react
        run: npm test

      - name: Build
        working-directory: frontend-react
        env:
          VITE_API_BASE_URL: https://homebudgetai-fullstack-2.onrender.com/api
        run: npm run build
